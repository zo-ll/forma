plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.noteembeddings'
version = '0.1.0'

android {
  namespace "expo.modules.noteembeddings"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // LiteRT-LM EmbeddingEngine, EmbeddingGemma 2 support, version 0.18.0.
  // Resolve the version from Google Maven.
  implementation "com.google.ai.edge.litertlm:litertlm-android:0.18.0"
}
