name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  source:
    name: Source, contracts, and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure empty dependency and result directories
        run: |
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/forma-npm-cold" >> "$GITHUB_ENV"
          echo "FORMA_CI_RESULTS=$RUNNER_TEMP/forma-ci-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: Install exact npm and locked dependencies
        run: |
          set -euo pipefail
          npm install --global npm@11.11.0
          npm ci
          npm run build
          npm ci --prefix apps/mobile
      - name: Check source owners and all contracts
        run: |
          set -euo pipefail
          npm run check:boundaries
          npm test
          npm run typecheck --prefix apps/mobile
      - name: Check dependencies with the explicit dated risk policy
        run: npm run check:dependencies
      - name: Preserve dependency verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-verdicts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/forma-ci-results/audit-*.json
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Cold Android ARM64 build
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Configure empty dependency, build, and result directories
        run: |
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/forma-npm-cold" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/forma-gradle-cold" >> "$GITHUB_ENV"
          echo "FORMA_CI_RESULTS=$RUNNER_TEMP/forma-ci-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833' # SDK command-line tools 23.0
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Install exact npm and root dependencies
        run: |
          set -euo pipefail
          npm install --global npm@11.11.0
          npm ci
      - name: Build only; never start a device or seed records
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          node scripts/mobile-host-device.mjs build
          mkdir -p "$FORMA_CI_RESULTS/android"
          cp apps/mobile/android/app/build/outputs/apk/hostgate/release/app-hostgate-release.apk "$FORMA_CI_RESULTS/android/"
          cp /tmp/forma-mobile-host-results/build-results.json "$FORMA_CI_RESULTS/android/"
      - name: Test native model files without a device
        working-directory: apps/mobile/android
        run: ./gradlew :app:testHostgateDebugUnitTest --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Preserve the standalone test APK and its source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/forma-ci-results/android/
          retention-days: 7
          if-no-files-found: error
